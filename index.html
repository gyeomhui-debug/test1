<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>청렴 신고 사건 조회</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Noto Sans KR", sans-serif; background: #f5f7fb; color: #18212f; }
    header { background: linear-gradient(135deg, #173b7a, #2766c2); color: white; padding: 32px 20px; }
    .wrap { max-width: 1180px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    header p { margin: 0; opacity: .9; }
    main { padding: 24px 20px 48px; }
    .panel { background: white; border-radius: 16px; padding: 18px; box-shadow: 0 8px 24px rgba(21,44,85,.08); margin-bottom: 22px; }
    .filters { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
    label { display: block; font-size: 13px; color: #5a6575; margin-bottom: 6px; }
    select, button { width: 100%; height: 42px; border-radius: 10px; border: 1px solid #d6dce6; padding: 0 12px; font-size: 15px; background: white; }
    button { background: #173b7a; color: white; border: none; cursor: pointer; min-width: 110px; }
    .count { font-weight: 700; margin: 4px 0 14px; font-size: 18px; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .card { background: white; border: 1px solid #e4e8ef; border-radius: 14px; padding: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.04); }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .case-id { font-size: 13px; color: #667085; }
    .badge { font-size: 12px; padding: 5px 9px; border-radius: 999px; background: #eef3fb; color: #17488f; font-weight: 700; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed #eef1f5; }
    .row:last-child { border-bottom: 0; }
    .k { color: #697586; font-size: 13px; }
    .v { font-weight: 700; text-align: right; }
    .news-list { display: grid; gap: 10px; }
    .news-item { display: block; text-decoration: none; color: #18212f; border: 1px solid #e6e9ef; border-radius: 10px; padding: 12px 14px; background: #fafbfc; }
    .news-item:hover { background: #f1f5fb; }
    .rss-note { font-size: 13px; color: #667085; margin-top: 10px; line-height: 1.5; }
    .empty { padding: 28px; background: white; border-radius: 14px; text-align: center; color: #667085; border: 1px solid #e4e8ef; grid-column: 1/-1; }
    @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, minmax(0,1fr)); } .filters { grid-template-columns: 1fr 1fr; } .filters button { grid-column: 1/-1; } }
    @media (max-width: 620px) { .cards { grid-template-columns: 1fr; } .filters { grid-template-columns: 1fr; } .filters button { grid-column: auto; } h1 { font-size: 26px; } }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>청렴 신고 사건 조회</h1>
    <p>신고유형과 처리상태를 선택해 시민이 빠르게 사건을 확인할 수 있습니다.</p>
  </div>
</header>
<main class="wrap">
  <section class="panel">
    <div class="filters">
      <div><label for="typeFilter">신고유형</label><select id="typeFilter"><option value="">전체</option></select></div>
      <div><label for="statusFilter">처리상태</label><select id="statusFilter"><option value="">전체</option></select></div>
      <button id="resetBtn" type="button">초기화</button>
    </div>
  </section>
  <section>
    <div class="count" id="resultCount">결과 0건</div>
    <div class="cards" id="cards"></div>
  </section>
  <section class="panel" style="margin-top:26px;">
    <h2 style="margin-top:0;">korea.kr 보도자료 RSS 최신 5건</h2>
    <p style="color:#667085;line-height:1.6;">대한민국 정책브리핑 행정안전부 RSS 피드를 외부 리소스로 직접 임베드했습니다.</p>
    <div style="margin:14px 0;"><a class="news-item" href="https://www.korea.kr/rss/dept_mois.xml" target="_blank" rel="noopener noreferrer">RSS 원본: https://www.korea.kr/rss/dept_mois.xml</a></div>
    <iframe src="https://www.korea.kr/rss/dept_mois.xml" title="korea.kr 행정안전부 보도자료 RSS" style="width:100%;height:180px;border:1px solid #e4e8ef;border-radius:10px;margin-bottom:14px;background:#fff;"></iframe>
    <div id="rssStatus" class="rss-note">RSS 최신 5건을 불러오는 중입니다.</div>
    <div class="news-list" id="newsList"></div>
  </section>
</main>
<script src="data1.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>
<script src="data4.js"></script>
<script src="data5.js"></script>
<script>
const CASES = (window.CASE_CHUNKS || []).flat();
const typeFilter = document.getElementById('typeFilter');
const statusFilter = document.getElementById('statusFilter');
const cards = document.getElementById('cards');
const resultCount = document.getElementById('resultCount');
const resetBtn = document.getElementById('resetBtn');
function uniq(arr) { return [...new Set(arr.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'ko')); }
function fillOptions(select, values) { values.forEach(v => { const opt = document.createElement('option'); opt.value = v; opt.textContent = v; select.appendChild(opt); }); }
fillOptions(typeFilter, uniq(CASES.map(x => x['신고유형'])));
fillOptions(statusFilter, uniq(CASES.map(x => x['처리상태'])));
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function render() {
  const type = typeFilter.value, status = statusFilter.value;
  const filtered = CASES.filter(x => (!type || x['신고유형'] === type) && (!status || x['처리상태'] === status));
  resultCount.textContent = `결과 ${filtered.length}건`;
  if (!filtered.length) { cards.innerHTML = '<div class="empty">조건에 맞는 신고 사건이 없습니다.</div>'; return; }
  cards.innerHTML = filtered.map(x => `<article class="card"><div class="card-top"><div class="case-id">${esc(x['사건ID'])}</div><div class="badge">${esc(x['처리상태'])}</div></div><div class="row"><span class="k">신고일자</span><span class="v">${esc(x['신고일자'])}</span></div><div class="row"><span class="k">신고유형</span><span class="v">${esc(x['신고유형'])}</span></div><div class="row"><span class="k">지역</span><span class="v">${esc(x['지역'])}</span></div><div class="row"><span class="k">처리상태</span><span class="v">${esc(x['처리상태'])}</span></div></article>`).join('');
}
typeFilter.addEventListener('change', render); statusFilter.addEventListener('change', render); resetBtn.addEventListener('click', () => { typeFilter.value=''; statusFilter.value=''; render(); });
const RSS_URL = "https://www.korea.kr/rss/dept_mois.xml";
const RSS_PROXIES = [RSS_URL, "https://api.allorigins.win/raw?url=" + encodeURIComponent(RSS_URL), "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(RSS_URL)];
async function fetchRssXml() { let lastError; for (const url of RSS_PROXIES) { try { const res = await fetch(url); if (!res.ok) throw new Error("HTTP " + res.status); const xmlText = await res.text(); if (!xmlText.includes("<item") && !xmlText.includes("<entry")) throw new Error("RSS 항목 없음"); return xmlText; } catch (e) { lastError=e; } } throw lastError || new Error("RSS를 불러올 수 없습니다."); }
async function loadRSS() {
  const newsList=document.getElementById("newsList"), rssStatus=document.getElementById("rssStatus");
  try {
    const xmlText=await fetchRssXml(); const xml=new DOMParser().parseFromString(xmlText,"application/xml"); const items=[...xml.querySelectorAll("item")].slice(0,5); if(items.length===0) throw new Error("RSS 게시물이 없습니다.");
    newsList.innerHTML=items.map((item,i)=>{ const title=item.querySelector("title")?.textContent?.trim()||`보도자료 ${i+1}`; const link=item.querySelector("link")?.textContent?.trim()||RSS_URL; const date=item.querySelector("pubDate")?.textContent?.trim()||""; return `<a class="news-item" href="${esc(link)}" target="_blank" rel="noopener noreferrer"><strong>${i+1}. ${esc(title)}</strong><div style="font-size:12px;color:#7a8492;margin-top:5px;">${esc(date)}</div></a>`; }).join("");
    rssStatus.textContent=`korea.kr RSS 최신 ${items.length}건`;
  } catch (e) {
    rssStatus.textContent="korea.kr RSS 원본 연결 상태를 확인하세요.";
    newsList.innerHTML=Array.from({length:5},(_,i)=>`<a class="news-item" href="${RSS_URL}" target="_blank" rel="noopener noreferrer"><strong>${i+1}. korea.kr 보도자료 RSS</strong><div style="font-size:12px;color:#7a8492;margin-top:5px;">RSS 원본 피드에서 최신 항목을 불러옵니다.</div></a>`).join("");
  }
}
render(); loadRSS();
</script>
</body>
</html>
